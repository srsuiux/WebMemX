<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>WebMemX</title>
  <defs>
    <linearGradient id="webmemx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Badge: rounded-square canvas, transparent outside -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#webmemx-bg)"/>

  <!-- Mark: an incoming page (satellite node) arriving along the web's
       orbit (ring) and settling into retained memory (core dot) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 320.00 145.15 A 128 128 0 1 1 145.15 192.00" stroke-width="34"/>
  </g>
  <circle cx="347.00" cy="98.38" r="24" fill="#ffffff"/>
  <circle cx="256" cy="256" r="40" fill="#ffffff"/>
</svg>
