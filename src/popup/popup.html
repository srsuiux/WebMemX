<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WebMemX</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>WebMemX</h1>
      <p class="tagline">Your memory of the web</p>
    </div>
    <div class="actions">
      <button id="rescan-btn" class="icon-btn" type="button" title="Rescan browser history" aria-label="Rescan browser history">
        <svg id="rescan-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
      <button id="theme-btn" class="icon-btn" type="button" title="Theme: Auto" aria-label="Toggle theme">
        <span id="theme-icon"></span>
      </button>
    </div>
  </header>

  <div class="status-bar" id="status-bar" hidden></div>

  <main>
    <section class="hero">
      <div class="hero-stat">
        <div class="hero-number" id="count">0</div>
        <div class="hero-label">Unique URLs</div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-stat">
        <div class="hero-number" id="domain-count">0</div>
        <div class="hero-label">Domains</div>
      </div>
    </section>
    <div class="date" id="date"></div>

    <section class="panel">
      <h2>Last 7 Days</h2>
      <div class="trend" id="trend"></div>
    </section>

    <section class="panel" id="domains-panel">
      <h2>Top Domains</h2>
      <div class="domain-list" id="domain-list"></div>
    </section>

    <section class="panel">
      <h2>Today's Activity</h2>
      <ul class="url-list" id="url-list"></ul>
      <p class="empty-state" id="empty-state" hidden>
        No web activity recorded yet.<br />
        Start browsing and WebMemX will remember it for you.
      </p>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
